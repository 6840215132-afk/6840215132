<!DOCTYPE html>
<html>
<head>
    <title>เว็บไซต์ของฉัน</title>
    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #003366;
        }

        img {
            width: 300px;
            border-radius: 10px;
        }

        ul {
            list-style-type: square;
            text-align: left;
            display: inline-block;
        }

        button {
            padding: 10px;
            margin: 5px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>

<script>
function showWelcome() {
    alert("ยินดีต้อนรับสู่เว็บไซต์ของฉัน");
}

function greetUser() {
    var name = document.getElementById("username").value;
    document.getElementById("result").innerHTML =
        "สวัสดี " + name + " ยินดีต้อนรับ";
}
</script>

</head>

<body>

<h1>เว็บไซต์เกี่ยวกับเทคโนโลยีเว็บ</h1>

<img src="https://picsum.photos/300" alt="รูปตัวอย่าง">

<p>
เว็บไซต์นี้จัดทำขึ้นเพื่อแนะนำพื้นฐานเกี่ยวกับการสร้างเว็บไซต์
ด้วย HTML CSS และ JavaScript
</p>

<h3>หัวข้อที่น่าสนใจ</h3>

<ul>
<li>HTML โครงสร้างเว็บไซต์</li>
<li>CSS การตกแต่งเว็บไซต์</li>
<li>JavaScript เพิ่มการโต้ตอบ</li>
</ul>

<p>
เยี่ยมชมเว็บไซต์เพิ่มเติม:
<a href="https://www.w3schools.com" target="_blank">
W3Schools
</a>
</p>

<br>

<button onclick="showWelcome()">แสดงข้อความต้อนรับ</button>

<br><br>

<input type="text" id="username" placeholder="กรอกชื่อของคุณ">
<button onclick="greetUser()">ทักทาย</button>

<p id="result"></p>

</body>
</html>
